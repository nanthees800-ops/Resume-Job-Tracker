{% extends "base.html" %}{% block title %}Settings{% endblock %}{% block content %}
<header class="topbar"><div><div class="eyebrow">PREFERENCES</div><h1>Settings</h1><p class="muted">Manage your personal workspace.</p></div></header>
<form method="post" class="panel settings-panel"><h2>Profile</h2><p class="muted">Your account information.</p><div class="form-stack"><label>Full name<input name="name" value="{{ user.name }}" required></label><label>Email address<input value="{{ user.email }}" disabled></label><label>Appearance<select name="theme"><option value="dark" {% if user.theme=='dark' %}selected{% endif %}>Dark</option><option value="light" {% if user.theme=='light' %}selected{% endif %}>Light</option></select></label></div><div class="form-actions"><button class="btn primary">Save changes</button></div></form>{% endblock %}
