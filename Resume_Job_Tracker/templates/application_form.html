{% extends "base.html" %}{% block title %}{{ 'Edit' if item else 'Add' }} application{% endblock %}{% block content %}
<header class="topbar"><div><div class="eyebrow">APPLICATION DETAILS</div><h1>{{ 'Edit application' if item else 'Add an opportunity' }}</h1><p class="muted">Capture the details and keep your search organized.</p></div><a class="btn secondary" href="{{ url_for('kanban') }}">← Back to board</a></header>
<form method="post" class="panel application-form"><div class="form-grid"><label>Company name *<input name="company" required value="{{ item.company if item else '' }}" placeholder="e.g. Google"></label><label>Job title *<input name="role" required value="{{ item.role if item else '' }}" placeholder="e.g. Product Designer"></label><label>Location<input name="location" value="{{ item.location if item else '' }}" placeholder="Remote / City"></label><label>Job posting URL<input type="url" name="job_url" value="{{ item.job_url if item else '' }}" placeholder="https://..."></label><label>Salary / compensation<input name="salary" value="{{ item.salary if item else '' }}" placeholder="e.g. ₹8–12 LPA"></label><label>Status<select name="status">{% for s in statuses %}<option {% if item and item.status==s %}selected{% elif not item and s=='Wishlist' %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Application date<input type="date" name="applied_date" value="{{ item.applied_date if item else '' }}"></label><label>Follow-up date<input type="date" name="follow_up_date" value="{{ item.follow_up_date if item else '' }}"></label><label class="span-two">Job description<textarea name="description" rows="4" placeholder="Responsibilities, requirements, useful links...">{{ item.description if item else '' }}</textarea></label><label class="span-two">Notes<textarea name="notes" rows="3" placeholder="Recruiter contact, interview notes, next steps...">{{ item.notes if item else '' }}</textarea></label></div><div class="form-actions"><a class="btn secondary" href="{{ url_for('kanban') }}">Cancel</a><button class="btn primary">Save application →</button></div></form>{% endblock %}
